<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentTeams Dashboard</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <h1>AgentTeams Dashboard</h1>
        <nav id="tabs" class="tabs">
          <button class="tab-btn active" data-tab="overview">Overview</button>
          <button class="tab-btn" data-tab="workers">Workers</button>
          <button class="tab-btn" data-tab="health">Health</button>
          <button class="tab-btn" data-tab="tasks">Manager Tasks</button>
          <button class="tab-btn" data-tab="board">Board</button>
          <button class="tab-btn" data-tab="projects">Projects</button>
          <button class="tab-btn" data-tab="files">Files</button>
          <button class="tab-btn" data-tab="providers">Providers</button>
        </nav>
      </header>
      <main id="main"></main>
      <div id="toast" class="toast" hidden></div>
      <dialog id="confirm-dialog">
        <form method="dialog" id="confirm-form">
          <p id="confirm-message"></p>
          <div class="dialog-actions">
            <button type="button" id="confirm-cancel">Cancel</button>
            <button type="submit" id="confirm-ok" class="danger">Confirm</button>
          </div>
        </form>
      </dialog>
      <dialog id="message-dialog">
        <form method="dialog" id="message-form">
          <p id="message-dialog-title"></p>
          <textarea id="message-body" rows="6" placeholder="Message text..."></textarea>
          <div class="dialog-actions">
            <button type="button" id="message-cancel">Cancel</button>
            <button type="submit" id="message-send">Send</button>
          </div>
        </form>
      </dialog>
      <dialog id="provider-dialog">
        <form method="dialog" id="provider-form">
          <p>Register AI Provider</p>
          <label>Name <input id="provider-name" required pattern="[a-z0-9][a-z0-9-]*" title="lowercase alphanumeric and hyphens" /></label>
          <label>Base URL <input id="provider-url" type="url" required placeholder="https://api.example.com/v1" /></label>
          <label>API Key <input id="provider-key" type="password" required /></label>
          <div class="dialog-actions">
            <button type="button" id="provider-cancel">Cancel</button>
            <button type="submit">Register</button>
          </div>
        </form>
      </dialog>
      <dialog id="model-provider-dialog">
        <form method="dialog" id="model-provider-form">
          <p id="model-provider-title"></p>
          <label>Model <select id="mp-model"><option value="">Loading…</option></select></label>
          <label id="mp-custom-row" style="display:none">Custom model <input id="mp-custom-model" placeholder="model-id" /></label>
          <label>Provider <select id="mp-provider"><option value="">(default)</option></select></label>
          <div class="dialog-actions">
            <button type="button" id="mp-cancel">Cancel</button>
            <button type="submit" class="primary">Save</button>
          </div>
        </form>
      </dialog>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
